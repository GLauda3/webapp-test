<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web App</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    h1 { color: #333; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4a90d9;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #357abd; }
    #message {
      margin-top: 20px;
      font-size: 18px;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>Hello, Web App!</h1>
  <button id="clickBtn">Click Me</button>
  <p id="message"></p>

  <script>
    let count = 0;
    document.getElementById('clickBtn').addEventListener('click', () => {
      count++;
      document.getElementById('message').textContent =
        count === 1 ? 'Button clicked once!' : `Button clicked ${count} times!`;
      // Change the text color to a random color on every click
      const randomColor = `hsl(${Math.floor(Math.random() * 360)}, 80%, 45%)`;
      document.getElementById('message').style.color = randomColor;
    });
  </script>
</body>
</html>
